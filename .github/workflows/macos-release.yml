name: Build and publish macOS update

on:
  push:
    branches: [main]
    paths:
      - 'AIChatApp/**'
      - '**/*.py'
      - 'backend.spec'
      - 'requirements*.txt'
      - 'scripts/**'
      - '.github/workflows/macos-release.yml'
  pull_request:
    paths:
      - 'AIChatApp/**'
      - '**/*.py'
      - 'backend.spec'
      - 'requirements*.txt'
      - 'scripts/**'
      - '.github/workflows/macos-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize production builds so a slower old build cannot replace a newer feed.
concurrency:
  group: macos-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SPARKLE_VERSION: '2.10.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-fastapi.txt
      - name: Prepare release version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$(uname -m)" = arm64
          # Changing the source marketing version's first two components starts
          # a new release series; patch/build numbers never need hand editing.
          base=$(sed -n 's/.*MARKETING_VERSION = \([0-9]*\.[0-9]*\)\..*;/\1/p' AIChatApp/AIChatApp.xcodeproj/project.pbxproj | head -1)
          test -n "$base"
          echo "RELEASE_VERSION=$base.$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD=10.$RUN_NUMBER.$RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install backend build dependencies
        run: python -m pip install -r requirements-fastapi.txt 'pyinstaller>=6.16,<7' 'cryptography>=42'
      - name: Check release signing configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing repository secret SPARKLE_PRIVATE_KEY'; exit 1; }
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private.key"
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle-private.key" >> "$GITHUB_ENV"
          echo "PUBLISH_UPDATE=1" >> "$GITHUB_ENV"
          echo "RELEASE_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION-build.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download matching Sparkle publishing tools
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          gh release download "$SPARKLE_VERSION" --repo sparkle-project/Sparkle \
            --pattern "Sparkle-$SPARKLE_VERSION.tar.xz" --dir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle/Sparkle-$SPARKLE_VERSION.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_TOOLS_DIR=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
      - name: Verify encrypted backup, WAL snapshots and restore rollback
        run: |
          xcrun swiftc -parse-as-library AIChatApp/Sources/Services/BackupArchive.swift \
            AIChatApp/Sources/Services/BackupRepository.swift scripts/test_encrypted_backup.swift \
            -o "$RUNNER_TEMP/aichat-backup-tests"
          "$RUNNER_TEMP/aichat-backup-tests"
      - name: Build and verify app, backend and signed update feed
        run: bash scripts/build_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIChatApp-${{ env.RELEASE_VERSION }}
          path: |
            release-output/*.dmg
            release-output/*.zip
            release-output/appcast.xml
          if-no-files-found: error
      - name: Publish verified release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload all assets to a draft before marking it latest. Clients never
          # see a release with a missing appcast or a half-uploaded ZIP.
          tag="v$RELEASE_VERSION-build.$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --target "$GITHUB_SHA" --draft \
            --title "AIChatApp $RELEASE_VERSION" --generate-notes \
            "release-output/AIChatApp-$RELEASE_VERSION.dmg" \
            "release-output/AIChatApp-$RELEASE_VERSION.zip" release-output/appcast.xml
          gh release edit "$tag" --draft=false --latest
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-private.key"
