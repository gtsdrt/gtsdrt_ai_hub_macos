			shellScript = "set -e\n# 内嵌后端：优先 onedir 目录版（冷启动 ~1s），回退 onefile 单文件（冷启动 15~20s）\nSRC_DIR=\"${SRCROOT}/../dist-onedir/backend_server\"\nSRC_FILE=\"${SRCROOT}/../dist/backend_server\"\nDST_DIR=\"${SRCROOT}/Resources/backend_server\"\n\n# 架构闸门：内嵌后端可执行文件必须是纯 arm64（含 arm64 且不含 x86_64），否则让构建失败。\n# 本项目只发布 Apple Silicon 原生产物，不允许 Rosetta / x86_64 混入。\nassert_arm64() {\n  _f=\"$1\"\n  [ -f \"$_f\" ] || { echo \"error: 找不到内嵌后端：$_f\" >&2; exit 1; }\n  _archs=\"$(/usr/bin/lipo -archs \"$_f\" 2>/dev/null || true)\"\n  case \" $_archs \" in\n    *\" arm64 \"*) ;;\n    *) echo \"error: $_f 不含 arm64 切片（实际：$_archs）\" >&2; exit 1 ;;\n  esac\n  case \" $_archs \" in\n    *\" x86_64 \"*) echo \"error: $_f 含 x86_64 切片（实际：$_archs）——本项目只发布纯 arm64\" >&2; exit 1 ;;\n  esac\n}\n\n# 清掉历史遗留：Resources/backend_server 曾是 onefile 单文件\nif [ -e \"$DST_DIR\" ] && [ ! -d \"$DST_DIR\" ]; then\n  rm -f \"$DST_DIR\"\nfi\n\nif [ -f \"$SRC_DIR/backend_server\" ]; then\n  assert_arm64 \"$SRC_DIR/backend_server\"\n  rm -rf \"$DST_DIR\"\n  /usr/bin/ditto \"$SRC_DIR\" \"$DST_DIR\"\n  chmod +x \"$DST_DIR/backend_server\"\n  echo \"note: 已从 ../dist-onedir/backend_server 同步最新版 onedir 内嵌后端（纯 arm64）\"\nelif [ -f \"$SRC_FILE\" ]; then\n  assert_arm64 \"$SRC_FILE\"\n  rm -rf \"$DST_DIR\"\n  mkdir -p \"$DST_DIR\"\n  cp -p \"$SRC_FILE\" \"$DST_DIR/backend_server\"\n  chmod +x \"$DST_DIR/backend_server\"\n  echo \"note: 未找到 onedir（../dist-onedir/backend_server），回退用 onefile 单文件（纯 arm64）\"\nelse\n  echo \"warning: 未找到内嵌后端产物（../dist-onedir/backend_server 或 ../dist/backend_server），沿用 Resources/backend_server\"\nfi\n\nassert_arm64 \"$DST_DIR/backend_server\"";
